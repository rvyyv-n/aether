name: Build & Test (Native AOT)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AetherPlayer.sln -p:Platform=x64

      - name: Build solution
        run: dotnet build AetherPlayer.sln -c Release -p:Platform=x64 --no-restore -warnaserror

      - name: Run unit & integration tests
        run: dotnet test AetherPlayer.sln -c Release -p:Platform=x64 --no-build --verbosity normal

      - name: Publish Native AOT build
        run: dotnet publish src/Aether.App/Aether.App.csproj -c Release -r win-x64 -p:Platform=x64 -warnaserror
