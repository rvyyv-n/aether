name: Build & Test (Native AOT)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AetherPlayer.sln -p:Platform=x64

      # Debug, like the local gate: a Release build of Aether.App turns on ReadyToRun and trimming,
      # which still fails on trim warnings in the Windows SDK projections (tracked in ROADMAP Pass 6).
      - name: Build solution
        run: dotnet build AetherPlayer.sln -c Debug -p:Platform=x64 --no-restore -warnaserror

      - name: Run unit & integration tests
        run: dotnet test AetherPlayer.sln -c Debug -p:Platform=x64 --no-build --verbosity normal
