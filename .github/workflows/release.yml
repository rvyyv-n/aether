name: Release

# Runs when a version tag such as v1.1.0 is pushed. It builds the Velopack installer (Setup.exe) and update packages and the portable zip, and uploads
# them to a DRAFT GitHub release; nothing is public until the draft is published by hand. Unsigned for now (ADR-0021).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Not "Aether": Velopack deletes %LOCALAPPDATA%\<id> on uninstall, and that folder holds the user's settings and resume data.
      PACK_ID: AetherPlayer
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # libmpv and ANGLE are not in Git (too big, and built outside this repo), so they come from a pinned release of this repository.
      # The hash is checked, so a replaced file fails the build instead of shipping.
      - name: Fetch libmpv and ANGLE
        shell: pwsh
        run: |
          $expected = '6572A522CFE8FC39E7420C4AF9FCAF6990C44D17DD03EEBC05E97021ED2DAA00'
          gh release download native-deps-1 --repo "${{ github.repository }}" --pattern native-deps.zip --dir "$env:RUNNER_TEMP"
          $zip = Join-Path $env:RUNNER_TEMP 'native-deps.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'native-deps.zip does not match the pinned SHA-256.' }
          New-Item -ItemType Directory -Force src/Aether.App/Native/x64 | Out-Null
          Expand-Archive $zip -DestinationPath src/Aether.App/Native/x64 -Force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '${{ github.ref_name }}' is not a version like v1.2.3." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the portable zip
        shell: pwsh
        run: ./tools/package-standalone.ps1 -Version $env:VERSION

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk --version 1.2.161

      # Deltas are built against the previous release; the first release has none, so a failed download is not an error.
      - name: Fetch the previous release
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" -o releases

      - name: Pack the update
        shell: pwsh
        run: >
          vpk pack --packId $env:PACK_ID --packVersion $env:VERSION --packTitle Aether --packAuthors rvyyv-n
          --packDir dist/Aether-portable --mainExe Aether.App.exe --icon src/Aether.App/Assets/AppIcon.ico -o releases
          --exclude ".*(Aether\.cmd|run-portable\.cmd|\.pdb)$"

      - name: Upload to a draft release
        shell: pwsh
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" `
            --tag "${{ github.ref_name }}" --releaseName "Aether $env:VERSION" -o releases
          gh release upload "${{ github.ref_name }}" dist/Aether-portable.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
